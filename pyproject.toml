[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-quneo-collider"
version = "0.1.0"
description = "QuNeo -> SuperCollider bubbles synth bridge"
requires-python = ">=3.11"
dependencies = ["pyliblo3>=0.17.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
